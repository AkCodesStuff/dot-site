<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Network Mock</title>
<style>
  :root{--bg:#f3f4f6;--ink:#141414;--muted:#6b7280;--net:rgba(20,20,20,.09);--net-major:rgba(20,20,20,.14);--node:rgba(20,20,20,.22);--route:#f26a21}
  .night{--bg:#07080a;--ink:#f5f5f4;--muted:#9ca3af;--net:rgba(255,255,255,.07);--net-major:rgba(255,255,255,.12);--node:rgba(255,255,255,.25)}
  *{box-sizing:border-box;margin:0}
  body{font-family:Inter,system-ui,sans-serif;background:#ddd;padding:16px;color:var(--ink)}
  .bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  button{font:600 13px/1 system-ui;padding:10px 14px;border-radius:8px;border:1px solid #bbb;background:#fff;cursor:pointer}
  button[aria-pressed=true]{background:#141414;color:#fff;border-color:#141414}
  .frame{position:relative;color:var(--ink);width:100%;max-width:1440px;aspect-ratio:16/10;margin:0 auto;background:var(--bg);overflow:hidden;border-radius:6px;transition:background .5s}
  svg.net{position:absolute;inset:0;width:100%;height:100%}
  .net path{fill:none;stroke:var(--net);stroke-width:1;vector-effect:non-scaling-stroke;transition:stroke .5s}
  .net path.major{stroke:var(--net-major);stroke-width:1.5}
  .net circle{fill:var(--node)}
  .net .route-ahead{stroke:var(--route);stroke-opacity:.35;stroke-dasharray:4 7;stroke-width:1.5}
  .net .route-done{stroke:var(--route);stroke-width:3;filter:drop-shadow(0 0 6px rgba(242,106,33,.6))}
  .stats{position:absolute;left:9%;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(2,auto);gap:clamp(24px,3vw,48px) clamp(32px,5vw,80px)}
  .eyebrow{position:absolute;left:9%;top:calc(50% - 22%);font:500 12px/1 ui-monospace,monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .n{font-weight:700;font-size:clamp(34px,4.4vw,72px);letter-spacing:-.03em;line-height:1;display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
  .n small{font-size:.26em;font-weight:600;color:var(--muted);letter-spacing:0}
  .l{margin-top:10px;font:600 11px/1.3 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .truck{position:absolute;left:76%;top:20%;width:5%;height:58%;transform:translateX(-50%) rotate(4deg);transform-origin:50% 30%}
  .cab{height:20%;background:#e8622b;border-radius:30% 30% 12% 12%}
  .box{height:78%;margin-top:2%;background:repeating-linear-gradient(0deg,#1e4fa8 0 5px,#2b63c7 5px 9px);border:2px solid #b8452a;border-radius:3px}
  .beam{position:absolute;top:-70%;width:34%;height:72%;background:linear-gradient(to top,rgba(255,240,210,.55),transparent);clip-path:polygon(30% 100%,70% 100%,100% 0,0 0);filter:blur(6px);opacity:0;transition:opacity .5s}
  .night .beam{opacity:1}
  .beam.a{left:4%}.beam.b{right:4%}
  .note{max-width:1440px;margin:12px auto 0;font:13px/1.5 system-ui;color:#333}
  @media (max-width:700px){.frame{aspect-ratio:9/16}.stats{left:6%;top:auto;bottom:6%;transform:none}.eyebrow{left:6%;top:auto;bottom:40%}.truck{left:62%;top:8%;width:14%;height:50%}}
</style>
</head>
<body>
<div class="bar">
  <button id="day" aria-pressed="true">Day</button>
  <button id="night" aria-pressed="false">Night</button>
  <button id="route" aria-pressed="true">Truck route highlighted</button>
</div>

<div class="frame" id="frame">
  <svg class="net" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
    <!-- major highways (double-line feel via two close paths) -->
    <path class="major" d="M-40 140 C 300 180, 520 90, 820 170 S 1300 260, 1500 210"/>
    <path class="major" d="M-40 148 C 300 188, 520 98, 820 178 S 1300 268, 1500 218"/>
    <path class="major" d="M180 -40 C 230 250, 120 520, 260 940"/>
    <path class="major" d="M188 -40 C 238 250, 128 520, 268 940"/>
    <!-- secondary roads -->
    <path d="M-40 620 C 260 560, 420 700, 700 640 S 1100 520, 1500 600"/>
    <path d="M1180 -40 C 1120 200, 1300 420, 1210 940"/>
    <path d="M430 -40 C 470 120, 400 300, 560 430 S 760 700, 720 940"/>
    <path d="M-40 400 C 160 380, 260 450, 420 420"/>
    <path d="M1500 420 C 1380 460, 1320 380, 1210 400"/>
    <path d="M900 -40 C 880 90, 1010 130, 1040 250"/>
    <path d="M1000 940 C 1040 820, 930 760, 980 660"/>
    <path d="M-40 820 C 140 780, 300 860, 500 800"/>
    <path d="M1500 780 C 1360 820, 1260 740, 1120 770"/>
    <!-- nodes (depots / junctions) -->
    <circle cx="820" cy="174" r="3.5"/><circle cx="222" cy="410" r="3"/>
    <circle cx="560" cy="430" r="3"/><circle cx="1210" cy="400" r="3"/>
    <circle cx="700" cy="640" r="3"/><circle cx="1040" cy="250" r="2.5"/>
    <circle cx="245" cy="828" r="2.5"/><circle cx="980" cy="660" r="2.5"/>
    <!-- the truck's route: part of the network -->
    <g id="routeG">
      <path class="route-ahead" d="M1094 -40 C 1094 60, 1094 120, 1094 180"/>
      <path class="route-done" d="M1094 180 C 1094 300, 1100 520, 1080 720 S 1050 880, 1060 940"/>
    </g>
  </svg>

  <div class="eyebrow">02 / The network</div>
  <div class="stats">
    <div><div class="n">850+</div><div class="l">Trucks on the road</div></div>
    <div><div class="n">90,000<small>sq ft</small></div><div class="l">Truck yard</div></div>
    <div><div class="n">2,65,000<small>sq ft</small></div><div class="l">Warehousing, upcoming</div></div>
    <div><div class="n">9,000<small>km</small></div><div class="l">Km / truck / month</div></div>
  </div>

  <div class="truck"><div class="beam a"></div><div class="beam b"></div><div class="cab"></div><div class="box"></div></div>
</div>
<p class="note">Mock only: truck is a placeholder shape and roads are hand-placed. In the build, roads are generated from a seed and the orange route is the truck's actual path.</p>

<script>
  const f=document.getElementById('frame'),d=document.getElementById('day'),n=document.getElementById('night'),r=document.getElementById('route'),g=document.getElementById('routeG');
  d.onclick=()=>{f.classList.remove('night');d.setAttribute('aria-pressed',true);n.setAttribute('aria-pressed',false)};
  n.onclick=()=>{f.classList.add('night');n.setAttribute('aria-pressed',true);d.setAttribute('aria-pressed',false)};
  r.onclick=()=>{const on=r.getAttribute('aria-pressed')!=='true';r.setAttribute('aria-pressed',on);g.style.display=on?'':'none'};
</script>
</body>
</html>
